<section class="section-pad location" id="contact">
  <div class="wrap location-inner">
    <div class="location-content">
      <div class="section-head location-head">
        <h2>{{ 'Où nous trouver' | t }}</h2>
        <p>{{ "Notre agence est ouverte 7j/7, en plein cœur d'Aouina." | t }}</p>
      </div>
      <div class="location-details">
        <div class="detail-item">
          <div class="detail-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11Z" />
              <circle cx="12" cy="10" r="2.5" />
            </svg>
          </div>
          <div>
            <span class="detail-label">{{ 'Adresse' | t }}</span>
            <span class="detail-value">{{ info.address }}</span>
          </div>
        </div>
        <div class="detail-item">
          <div class="detail-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7v5l3.5 2" />
            </svg>
          </div>
          <div>
            <span class="detail-label">{{ 'Horaires' | t }}</span>
            <span class="detail-value">{{ info.hours }}</span>
          </div>
        </div>
        <div class="detail-item">
          <div class="detail-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 5c0-1 1-2 2-2h2l2 5-2 2c1 3 3 5 6 6l2-2 5 2v2c0 1-1 2-2 2C10 20 4 14 4 5Z" />
            </svg>
          </div>
          <div>
            <span class="detail-label">{{ 'Téléphone' | t }}</span>
            <a class="detail-value detail-link" [href]="'tel:' + info.phone">{{ info.phone }}</a>
          </div>
        </div>
      </div>
      <a class="btn btn-primary btn-lg" [href]="directionsLink" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 11l18-8-8 18-2-8-8-2Z" />
        </svg>
        {{ 'Itinéraire' | t }}
      </a>
    </div>
    <div class="location-map">
      <iframe
        [src]="mapEmbedUrl"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        [attr.title]="'Localisation Dada Rent Car — Aouina, Tunis' | t"
      ></iframe>
    </div>
  </div>
</section>
