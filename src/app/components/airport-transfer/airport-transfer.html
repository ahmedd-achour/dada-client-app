<section class="airport">
  <img class="airport-bg" src="assets/airport-transfer-banner.png" alt="Livraison à l'aéroport Tunis-Carthage" />
  <div class="airport-overlay"></div>
  <div class="wrap airport-inner">
    <span class="eyebrow">Aéroport Tunis-Carthage</span>
    <h2>Vous arrivez en avion ? On vous attend avec les clés.</h2>
    <p>Indiquez votre vol, on livère votre voiture directement au terminal — sans détour par l'agence.</p>
    <a class="btn btn-primary btn-lg" [href]="whatsappLink" target="_blank" rel="noopener">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12a8 8 0 1 1 3.2 6.4L4 20l1.1-3.5A7.96 7.96 0 0 1 4 12Z" />
      </svg>
      Réserver un transfert
    </a>
  </div>
</section>
