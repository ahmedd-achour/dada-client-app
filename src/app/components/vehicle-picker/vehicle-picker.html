<div class="vehicle-field" #field>
  <button type="button" class="vehicle-preview" aria-haspopup="listbox" [attr.aria-expanded]="open" (click)="toggle()">
    <img [src]="current.image" [alt]="current.name" />
    <div class="vehicle-preview-info">
      <span class="vehicle-preview-badge">{{ current.badge }}</span>
      <span class="vehicle-preview-name">{{ current.name }}</span>
      <span class="vehicle-preview-specs">{{ current.seats }} places · {{ current.transmission }}</span>
    </div>
    <svg class="vehicle-preview-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m8 9 4-4 4 4M8 15l4 4 4-4" />
    </svg>
  </button>

  @if (open) {
    <div class="vehicle-picker-panel" role="listbox">
      @for (category of categories; track category.name) {
        <button
          type="button"
          class="vehicle-option"
          role="option"
          [class.active]="category.name === selected"
          [attr.aria-selected]="category.name === selected"
          (click)="pick(category.name)"
        >
          <img [src]="category.image" [alt]="category.name" />
          <span class="vehicle-option-info">
            <span class="vehicle-option-name">{{ category.name }}</span>
            <span class="vehicle-option-price">{{ category.priceLabel }} / jour</span>
          </span>
          @if (category.name === selected) {
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 6L9 17l-5-5" />
            </svg>
          }
        </button>
      }
    </div>
  }
</div>
