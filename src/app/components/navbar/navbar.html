<header class="nav">
  <div class="wrap nav-inner">
    <a class="logo" href="#top">
      <img src="assets/logo.png" alt="Dada Rent Car" class="logo-img" />
    </a>
    <nav class="nav-links">
      <a href="#fleet">Flotte</a>
      <a href="#pricing">Tarifs</a>
      <a href="#how">Comment ça marche</a>
      <a href="#contact">Contact</a>
      <a href="/admin">Admin</a>
    </nav>
    <div class="nav-cta">
      <a class="nav-phone" [href]="'tel:' + phone">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5c0-1 1-2 2-2h2l2 5-2 2c1 3 3 5 6 6l2-2 5 2v2c0 1-1 2-2 2C10 20 4 14 4 5Z" />
        </svg>
        {{ phone }}
      </a>
      <button type="button" class="menu-toggle" (click)="toggleMenu()" aria-label="Ouvrir le menu" [attr.aria-expanded]="menuOpen()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="7" x2="20" y2="7" /><line x1="4" y1="12" x2="20" y2="12" /><line x1="4" y1="17" x2="20" y2="17" />
        </svg>
      </button>
    </div>
  </div>
</header>

@if (menuOpen()) {
  <div class="sidebar-overlay" (click)="closeMenu()"></div>
}

<aside class="sidebar" [class.open]="menuOpen()">
  <div class="sidebar-head">
    <img src="assets/logo.png" alt="Dada Rent Car" class="sidebar-logo" />
    <button type="button" class="sidebar-close" (click)="closeMenu()" aria-label="Fermer le menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="6" y1="6" x2="18" y2="18" /><line x1="18" y1="6" x2="6" y2="18" />
      </svg>
    </button>
  </div>

  <nav class="sidebar-links">
    <a href="#fleet" (click)="closeMenu()">Flotte</a>
    <a href="#pricing" (click)="closeMenu()">Tarifs</a>
    <a href="#how" (click)="closeMenu()">Comment ça marche</a>
    <a href="#contact" (click)="closeMenu()">Contact</a>
    <a href="/admin" (click)="closeMenu()">Admin</a>
  </nav>

  <div class="sidebar-actions">
    <a class="nav-phone" [href]="'tel:' + phone" (click)="closeMenu()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5c0-1 1-2 2-2h2l2 5-2 2c1 3 3 5 6 6l2-2 5 2v2c0 1-1 2-2 2C10 20 4 14 4 5Z" />
      </svg>
      {{ phone }}
    </a>
    <a class="btn btn-primary btn-block" [href]="whatsappLink" target="_blank" rel="noopener" (click)="closeMenu()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12a8 8 0 1 1 3.2 6.4L4 20l1.1-3.5A7.96 7.96 0 0 1 4 12Z" />
      </svg>
      Réserver sur WhatsApp
    </a>
  </div>
</aside>
