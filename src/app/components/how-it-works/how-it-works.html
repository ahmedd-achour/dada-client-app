<section class="section-pad how-section" id="how">
  <div class="how-blob"></div>
  <div class="wrap">
    <div class="section-head">
      <h2>{{ 'Comment ça marche' | t }}</h2>
      <p>{{ 'Trois étapes vous séparent de la route.' | t }}</p>
    </div>
    <div class="steps-grid">
      @for (step of steps; track step.number) {
        <div class="step">
          <span class="step-num">{{ step.number }}</span>
          <div class="step-icon">
            @switch (step.icon) {
              @case ('fleet') {
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 13h1.2a2 2 0 0 1 1.9 1.4l.2.8a2 2 0 0 0 1.9 1.4h7.4a2 2 0 0 0 1.9-1.4l.2-.8A2 2 0 0 1 19.8 13H21" />
                  <path d="M5 13l1.4-4.6A3 3 0 0 1 9.3 6.3h5.4a3 3 0 0 1 2.9 2.1L19 13" />
                  <rect x="3" y="13" width="18" height="4.2" rx="2" />
                </svg>
              }
              @case ('chat') {
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 12a8 8 0 1 1 3.2 6.4L4 20l1.1-3.5A7.96 7.96 0 0 1 4 12Z" />
                </svg>
              }
              @case ('key') {
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="8" cy="15" r="4" />
                  <path d="M11 12l9-9" />
                  <path d="M16 7l3 3" />
                  <path d="M13 10l2.5 2.5" />
                </svg>
              }
            }
          </div>
          <h3>{{ step.title | t }}</h3>
          <p>{{ step.description | t }}</p>
        </div>
      }
    </div>
  </div>
</section>
