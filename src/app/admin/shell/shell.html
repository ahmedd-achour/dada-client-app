<div class="admin">
  <header class="admin-bar">
    @if (isDetailView()) {
      <a routerLink="/admin" class="admin-back" aria-label="Retour à la liste">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6" />
        </svg>
        <span>Retour</span>
      </a>
    } @else {
      <a routerLink="/admin" class="admin-brand">
        <img src="assets/logo.png" alt="Dada Rent Car" />
        <span>Espace admin</span>
      </a>
    }
    <button type="button" class="btn btn-ghost btn-sm" (click)="logout()">Déconnexion</button>
  </header>
  <main class="admin-content">
    <router-outlet />
  </main>

  <a routerLink="/admin/new" class="fab" aria-label="Nouvelle réservation">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" />
    </svg>
  </a>

  <nav class="tab-bar">
    <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="tab-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z" />
      </svg>
      <span>Accueil</span>
    </a>
    <a routerLink="/admin/stats" routerLinkActive="active" class="tab-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="18" y2="10" /><line x1="12" y1="20" x2="12" y2="4" /><line x1="6" y1="20" x2="6" y2="14" />
      </svg>
      <span>Stats</span>
    </a>
    <a routerLink="/admin/archive" routerLinkActive="active" class="tab-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="21 8 21 21 3 21 3 8" /><rect x="1" y="3" width="22" height="5" /><line x1="10" y1="12" x2="14" y2="12" />
      </svg>
      <span>Archives</span>
    </a>
    <a routerLink="/admin/fleet" routerLinkActive="active" class="tab-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 13h1.2a2 2 0 0 1 1.9 1.4l.2.8a2 2 0 0 0 1.9 1.4h7.4a2 2 0 0 0 1.9-1.4l.2-.8A2 2 0 0 1 19.8 13H21" />
        <path d="M5 13l1.4-4.6A3 3 0 0 1 9.3 6.3h5.4a3 3 0 0 1 2.9 2.1L19 13" />
        <rect x="3" y="13" width="18" height="4.2" rx="2" />
      </svg>
      <span>Flotte</span>
    </a>
  </nav>
</div>
